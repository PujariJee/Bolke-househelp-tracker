<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bolke — Voice AI for Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg:           #F8FAFC;
    --surface:      #FFFFFF;
    --border:       #E2E8F0;
    --primary:      #6366F1;
    --primary-dark: #4F46E5;
    --primary-light:#EEF2FF;
    --text:         #0F172A;
    --text-muted:   #64748B;
    --text-subtle:  #94A3B8;
    --success:      #10B981;
    --success-bg:   #ECFDF5;
    --warning:      #F59E0B;
    --danger:       #EF4444;
    --radius-sm:    8px;
    --radius:       12px;
    --radius-lg:    16px;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.05);
    --shadow:       0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    --shadow-lg:    0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text);
  }

  /* ── HEADER ──────────────────────────────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: var(--shadow-sm);
  }

  .header-left { display: flex; align-items: center; gap: 10px; }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--primary); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(99,102,241,.35);
  }

  .logo-text h1 { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
  .logo-text p  { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .header-right { display: flex; align-items: center; gap: 8px; }

  .status-pill {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 99px;
    font-size: 11px; font-weight: 600;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-pill.connected    { background: var(--success-bg); color: #065F46; }
  .status-pill.connected .dot { background: var(--success); }
  .status-pill.disconnected { background: #FEF9C3; color: #713F12; cursor: pointer; }
  .status-pill.disconnected .dot { background: var(--warning); animation: blink 2s infinite; }
  .status-pill.demo-mode { background: var(--primary-light); color: #3730A3; cursor: default; }
  .status-pill.demo-mode .dot { background: var(--primary); }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

  .settings-btn {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    background: var(--bg); border: 1px solid var(--border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 15px; transition: background .15s;
  }
  .settings-btn:hover { background: var(--border); }

  /* ── DEMO BANNER ─────────────────────────────────────────────────────── */
  .demo-banner {
    background: linear-gradient(135deg, var(--primary-light) 0%, #F0F9FF 100%);
    border-bottom: 1px solid #C7D2FE;
    padding: 9px 16px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #3730A3; line-height: 1.5;
    flex-shrink: 0;
  }
  .demo-banner strong { font-weight: 700; }
  .demo-banner.hidden { display: none; }

  /* ── LAYOUT ──────────────────────────────────────────────────────────── */
  .main { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 61px); }

  /* ── CHAT PANEL ──────────────────────────────────────────────────────── */
  .chat-panel {
    flex: 1; display: flex; flex-direction: column;
    background: var(--surface); border-right: 1px solid var(--border); min-width: 0;
  }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
  }

  .msg { display: flex; flex-direction: column; max-width: 82%; animation: fadeUp .2s ease; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot  { align-self: flex-start; align-items: flex-start; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-label {
    font-size: 10px; font-weight: 600; color: var(--text-subtle);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px;
  }

  .msg-bubble {
    padding: 11px 15px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.65; word-break: break-word;
  }
  .msg.user .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  .msg-bubble { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; white-space: pre-line; }

  .typing-bubble {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); border-bottom-left-radius: 4px;
    padding: 13px 16px; display: flex; gap: 5px; align-items: center;
  }
  .typing-bubble span { width: 7px; height: 7px; background: var(--text-subtle); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing-bubble span:nth-child(2) { animation-delay: .2s; }
  .typing-bubble span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

  /* ── MIC SECTION ─────────────────────────────────────────────────────── */
  .mic-section {
    padding: 14px 16px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
  }

  .mic-status-text { font-size: 12px; font-weight: 500; color: var(--text-muted); min-height: 18px; text-align: center; }

  /* mic + TTS side-by-side, mic stays centered */
  .mic-row {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; width: 100%; position: relative;
  }
  .mic-row-spacer { width: 44px; flex-shrink: 0; } /* balances the TTS button */

  #micBtn {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--primary); color: #fff; border: none;
    font-size: 26px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(99,102,241,.4);
    transition: all .15s; touch-action: none; user-select: none;
    flex-shrink: 0;
  }
  #micBtn:hover { box-shadow: 0 6px 20px rgba(99,102,241,.5); transform: translateY(-1px); }
  #micBtn:active { transform: scale(.93); }
  #micBtn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  #micBtn.listening {
    background: var(--danger); box-shadow: 0 4px 16px rgba(239,68,68,.45);
    animation: pulseGlow 1.2s ease-in-out infinite;
  }
  #micBtn.processing {
    background: var(--warning); box-shadow: 0 4px 16px rgba(245,158,11,.4); animation: none;
  }
  @keyframes pulseGlow {
    0%,100% { box-shadow: 0 4px 16px rgba(239,68,68,.45); transform: scale(1); }
    50%      { box-shadow: 0 4px 28px rgba(239,68,68,.7); transform: scale(1.06); }
  }

  /* TTS toggle button */
  #ttsBtn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--bg); border: 1.5px solid var(--border);
    cursor: pointer; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0; user-select: none;
  }
  #ttsBtn:hover { background: var(--primary-light); border-color: var(--primary); }
  #ttsBtn.tts-active { background: var(--primary-light); border-color: var(--primary); }

  .mic-hint { font-size: 11px; color: var(--text-subtle); text-align: center; }

  /* ── INPUT ROW ───────────────────────────────────────────────────────── */
  .input-row { display: flex; gap: 8px; padding: 0 16px 16px; align-items: center; flex-shrink: 0; }

  .input-row input {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 14px; font-family: inherit;
    outline: none; background: var(--bg); color: var(--text); transition: border-color .15s, box-shadow .15s;
  }
  .input-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.1); background: var(--surface); }
  .input-row input::placeholder { color: var(--text-subtle); }

  .send-btn {
    height: 40px; padding: 0 16px; background: var(--primary); color: #fff;
    border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; white-space: nowrap; transition: background .15s;
  }
  .send-btn:hover { background: var(--primary-dark); }
  .send-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── RECORDS PANEL ───────────────────────────────────────────────────── */
  .records-panel { width: 304px; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; flex-shrink: 0; }

  .records-header {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
  }
  .records-header h2 { font-size: 13px; font-weight: 700; letter-spacing: -.2px; }
  .rec-count { font-size: 12px; color: var(--text-subtle); margin-top: 1px; }

  .clear-link { font-size: 11px; color: var(--danger); background: none; border: none; cursor: pointer; font-family: inherit; font-weight: 500; }
  .clear-link:hover { text-decoration: underline; }

  .records-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .worker-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    box-shadow: var(--shadow-sm); transition: box-shadow .15s;
  }
  .worker-card:hover { box-shadow: var(--shadow); }

  .worker-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .worker-name   { font-size: 14px; font-weight: 700; }
  .worker-salary { font-size: 12px; color: var(--text-muted); font-weight: 500; }

  .absence-list { display: flex; flex-direction: column; gap: 4px; }
  .absence-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }

  .tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
  .tag-absent { background: #FEE2E2; color: #991B1B; }
  .tag-half   { background: #FEF9C3; color: #713F12; }

  .no-absences { font-size: 12px; color: var(--text-subtle); font-style: italic; }

  .net-pay-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .net-pay-label  { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .net-pay-amount { font-size: 13px; font-weight: 700; color: var(--success); }

  .demo-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    background: var(--primary-light); color: var(--primary); padding: 1px 6px; border-radius: 99px;
    margin-left: 6px; vertical-align: middle;
  }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px; gap: 10px; color: var(--text-subtle); }
  .empty-icon { font-size: 30px; }
  .empty-state p { font-size: 13px; text-align: center; line-height: 1.6; }

  /* ── MODAL ───────────────────────────────────────────────────────────── */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal-bg.hidden { display: none; }

  .modal {
    background: var(--surface); border-radius: var(--radius-lg); padding: 24px;
    max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg);
  }

  .modal-title    { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin-bottom: 10px; }

  .modal p  { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 10px; }
  .modal ol { font-size: 13px; color: var(--text); line-height: 1.9; padding-left: 18px; margin-bottom: 12px; }

  .field-label { font-size: 12px; font-weight: 600; color: var(--text); display: block; margin-bottom: 6px; margin-top: 12px; }

  .modal input[type=url],
  .modal input[type=password],
  .modal input[type=text] {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none;
    color: var(--text); background: var(--bg); transition: border-color .15s, box-shadow .15s;
  }
  .modal input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.1); background: var(--surface); }

  .code-block {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px; font-size: 11px; font-family: 'Courier New', monospace;
    white-space: pre; overflow-x: auto; line-height: 1.7; color: var(--text);
    max-height: 150px; overflow-y: auto; margin-bottom: 8px;
  }

  .copy-btn { font-size: 11px; font-family: inherit; font-weight: 600; background: var(--primary-light); color: var(--primary); border: none; border-radius: var(--radius-sm); padding: 5px 12px; cursor: pointer; margin-bottom: 12px; }
  .copy-btn:hover { background: #C7D2FE; }

  .modal-btns { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .btn { border: none; border-radius: var(--radius-sm); padding: 9px 18px; font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer; transition: background .15s; }
  .btn-secondary { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-danger { background: none; color: var(--danger); font-size: 12px; padding: 6px 0; font-weight: 500; }
  .btn-danger:hover { text-decoration: underline; }

  /* ── RESPONSIVE ──────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .records-panel { display: none; }
    .main { height: calc(100vh - 61px); }
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="logo-icon">🗣️</div>
    <div class="logo-text">
      <h1>Bolke</h1>
      <p>हिंदी · English · Hinglish</p>
    </div>
  </div>
  <div class="header-right">
    <div class="status-pill" id="dbStatus">
      <div class="dot"></div>
      <span id="dbStatusText">...</span>
    </div>
  </div>
</header>

<div class="main">
  <div class="chat-panel">

    <!-- Demo mode banner — hidden for authorized users -->
    <div class="demo-banner" id="demoBanner">
      <span>👁️</span>
      <span><strong>Portfolio demo</strong> — read-only view. Voice input fully works — tap the mic and speak!</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <!-- welcome message injected by JS based on auth state -->
    </div>

    <div class="mic-section">
      <div class="mic-status-text" id="micStatus">Tap mic to speak</div>
      <div class="mic-row">
        <div class="mic-row-spacer"></div>
        <button id="micBtn" onclick="toggleMic()">🎤</button>
        <button id="ttsBtn" onclick="toggleTTS()" title="Voice replies ON">🔊</button>
      </div>
      <div class="mic-hint" id="micHint">Groq Whisper · Hindi, English &amp; Hinglish</div>
    </div>

    <div class="input-row">
      <input type="text" id="userInput" placeholder="Or type here..." />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="records-panel">
    <div class="records-header">
      <div>
        <h2>Workers</h2>
        <div class="rec-count" id="workerCount">0 workers</div>
      </div>
      <button class="clear-link" id="clearBtn" onclick="clearAllData()" style="display:none">Clear all</button>
    </div>
    <div class="records-body" id="recordsBody">
      <div class="empty-state">
        <div class="empty-icon">👷</div>
        <p>Loading...</p>
      </div>
    </div>
  </div>
</div>

<script>
// ─── Demo data ────────────────────────────────────────────────────────────────
const DEMO_WORKERS = {
  'Raju': {
    monthlySalary: 8000,
    absences: [
      { date: '3 Jun 2026', type: 'absent' },
      { date: '10 Jun 2026', type: 'absent' },
      { date: '15 Jun 2026', type: 'half' }
    ]
  },
  'Sunita': {
    monthlySalary: 7500,
    absences: [
      { date: '5 Jun 2026', type: 'half' },
      { date: '12 Jun 2026', type: 'absent' }
    ]
  },
  'Geeta': {
    monthlySalary: 9000,
    absences: []
  }
};

// ─── State ────────────────────────────────────────────────────────────────────
let workers     = JSON.parse(localStorage.getItem('bolke_workers') || '{}');
let chatHistory = [];
let supaUrl     = localStorage.getItem('bolke_supa_url') || 'https://qmbjhfiyddsesrbignyy.supabase.co';
let supaKey     = localStorage.getItem('bolke_supa_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYmpoZml5ZGRzZXNyYmlnbnl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDg2NTYsImV4cCI6MjA5NjU4NDY1Nn0.ca5JxpWMqCdRGnsr27L7KSuLxqjZIov8x844M5MOvHI';
let supa        = null;
let authToken   = '';
let isAuthorized = false;
let ttsEnabled  = localStorage.getItem('bolke_tts') !== 'false'; // default ON
let voices      = [];

// ─── Auth / Token ─────────────────────────────────────────────────────────────
function initAuth() {
  const urlToken = new URLSearchParams(window.location.search).get('token');
  if (urlToken) {
    localStorage.setItem('bolke_token', urlToken);
    // Clean the token from the URL so it's not visible in browser history
    window.history.replaceState({}, '', window.location.pathname);
  }
  authToken    = localStorage.getItem('bolke_token') || '';
  isAuthorized = !!authToken;
}

// ─── TTS (Web Speech API) ─────────────────────────────────────────────────────
if (window.speechSynthesis) {
  voices = speechSynthesis.getVoices();
  speechSynthesis.addEventListener('voiceschanged', () => { voices = speechSynthesis.getVoices(); });
}

function speak(text) {
  if (!ttsEnabled || !window.speechSynthesis) return;
  // Strip emoji and markdown before speaking
  const clean = text
    .replace(/[\u{1F300}-\u{1FFFF}]/gu, '')  // emoji block
    .replace(/[⚙️✅⚠🚫🔑🔄📋👷🏠👁]/g, '')
    .replace(/\*\*/g, '').replace(/\*/g, '')
    .replace(/\n+/g, '. ')
    .trim();
  if (!clean) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang = 'hi-IN';
  utt.rate = 0.88;
  utt.pitch = 1.0;
  const hindiVoice = voices.find(v => v.lang === 'hi-IN' || v.lang.startsWith('hi'));
  if (hindiVoice) utt.voice = hindiVoice;
  speechSynthesis.speak(utt);
}

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  localStorage.setItem('bolke_tts', ttsEnabled);
  updateTTSBtn();
  if (!ttsEnabled && window.speechSynthesis) speechSynthesis.cancel();
}

function updateTTSBtn() {
  const btn = document.getElementById('ttsBtn');
  if (!btn) return;
  btn.textContent = ttsEnabled ? '🔊' : '🔇';
  btn.title = ttsEnabled ? 'Voice replies ON — tap to mute' : 'Voice replies OFF — tap to unmute';
  btn.classList.toggle('tts-active', ttsEnabled);
}

// ─── Supabase ─────────────────────────────────────────────────────────────────
function initSupa() {
  if (!supaUrl || !supaKey) { supa = null; return; }
  try { supa = window.supabase.createClient(supaUrl, supaKey); }
  catch(e) { supa = null; console.warn('Supabase init failed:', e); }
}

async function loadFromSupa() {
  if (!supa) return;
  try {
    const [{ data: wRows, error: wErr }, { data: aRows, error: aErr }] = await Promise.all([
      supa.from('workers').select('*'),
      supa.from('absences').select('*')
    ]);
    if (wErr || aErr) throw wErr || aErr;
    workers = {};
    wRows.forEach(w => { workers[w.name] = { _id: w.id, monthlySalary: w.monthly_salary, absences: [] }; });
    aRows.forEach(a => {
      const w = Object.values(workers).find(x => x._id === a.worker_id);
      if (w) w.absences.push({ date: a.date, type: a.type });
    });
    localStorage.setItem('bolke_workers', JSON.stringify(workers));
    renderRecords();
    appendMsg('bot', '✅ Data loaded from Supabase.', false);
  } catch(e) {
    appendMsg('bot', '⚠ Could not load from Supabase. Check your URL and key in ⚙️ Settings.\n' + e.message, false);
  }
}

async function saveWorkerSupa(name, salary) {
  if (!supa) return null;
  const { data, error } = await supa
    .from('workers')
    .upsert({ name, monthly_salary: salary }, { onConflict: 'name' })
    .select().single();
  if (error) { console.warn('Save worker error:', error); return null; }
  return data;
}

async function saveAbsenceSupa(workerId, date, type) {
  if (!supa || !workerId) return;
  const { error } = await supa
    .from('absences')
    .upsert({ worker_id: workerId, date, type }, { onConflict: 'worker_id,date' });
  if (error) console.warn('Save absence error:', error);
}

function persist() { localStorage.setItem('bolke_workers', JSON.stringify(workers)); }

// autoSpeak: false for system messages, true (default) for actual conversation
function appendMsg(role, html, autoSpeak = true) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  if (role === 'bot') {
    const lbl = document.createElement('div');
    lbl.className = 'msg-label'; lbl.textContent = 'Bolke';
    wrap.appendChild(lbl);
  }
  const bub = document.createElement('div');
  bub.className = 'msg-bubble';
  role === 'bot' ? (bub.innerHTML = html.replace(/\n/g, '<br>')) : (bub.textContent = html);
  wrap.appendChild(bub);

  wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });

function showTyping() {

  wrap.className = 'msg bot'; wrap.id = 'typingEl';
  const lbl = document.createElement('div'); lbl.className = 'msg-label'; lbl.textContent = 'Bolke';

function hideTyping() { const el = document.getElementById('typingEl'); if (el) el.remove(); }

function calcNetPay(w) {
  const sal = w.monthlySalary || 0, rate = sal / 26;
  const full = (w.absences || []).filter(a => a.type === 'absent').length;
  const half = (w.absences || []).filter(a => a.type === 'half').length;
  return Math.round(sal - full * rate - half * (rate / 2));
}

function renderRecords() {
  const body = document.getElementById('recordsBody');
  const keys = Object.keys(workers);
  const demoSuffix = !isAuthorized ? ' <span class="demo-badge">demo</span>' : '';
  document.getElementById('workerCount').innerHTML =
    (keys.length ? `${keys.length} worker${keys.length > 1 ? 's' : ''}` : '0 workers') + demoSuffix;

  if (!keys.length) {
    body.innerHTML = `<div class="empty-state"><div class="empty-icon">👷</div><p>No workers yet.<br>Add one by speaking or typing.</p></div>`;
    return;
  }
  body.innerHTML = '';
  keys.forEach(name => {
    const w = workers[name];
    const net = calcNetPay(w);
    const absHtml = (w.absences || []).length
      ? (w.absences || []).map(a => `<div class="absence-item"><span>${a.date}</span><span class="tag ${a.type==='half'?'tag-half':'tag-absent'}">${a.type==='half'?'Half day':'Absent'}</span></div>`).join('')
      : `<div class="no-absences">No absences logged</div>`;
    const card = document.createElement('div');
    card.className = 'worker-card';
    card.innerHTML = `
      <div class="worker-card-top">
        <div class="worker-name">${name}</div>
        <div class="worker-salary">₹${(w.monthlySalary||0).toLocaleString('en-IN')}/mo</div>
      </div>
      <div class="absence-list">${absHtml}</div>
      <div class="net-pay-row">
        <span class="net-pay-label">Net payable</span>
        <span class="net-pay-amount">₹${net.toLocaleString('en-IN')}</span>
      </div>`;
    body.appendChild(card);
  });
}

function clearAllData() {

// ─── AI (Groq via Vercel function) ────────────────────────────────────────────
async function callAI(userMessage) {
  if (!isAuthorized) {
    // Demo mode — contextual canned response, no API call needed
    await new Promise(r => setTimeout(r, 700 + Math.random() * 400)); // realistic delay
    return { reply: getDemoResponse(userMessage), action: null, data: {} };
  }

  const system = `You are a friendly househelp absence tracker assistant for an Indian household. You understand Hindi, English, and Hinglish.
Current worker data: ${JSON.stringify(workers, null, 2)}
Today: ${new Date().toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' })}

Respond ONLY with raw JSON — no markdown, no code fences:
{ "reply": "...", "action": null|"add_worker"|"log_absence"|"calculate_pay", "data": {} }

Action data shapes:
- add_worker:    { name, monthlySalary }
- log_absence:   { name, date (e.g. "17 May 2026"), type: "absent"|"half" }
- calculate_pay: { name } or { name: "all" }

Rules:
- "nahi aaya" = absent | "aadha din"/"half day" = half | "add karo" = add worker
- If name not in data, ask to add them first with their monthly salary
- Use rupee symbol for amounts. Be warm and brief. Reply in the same language the user used.`;

  chatHistory.push({ role: 'user', content: userMessage });

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-demo-token': authToken },
    body: JSON.stringify({ messages: [{ role: 'system', content: system }, ...chatHistory] })
  });

  if (res.status === 403) {
    // Token invalid/expired — fall back to demo mode gracefully
    isAuthorized = false; authToken = '';
    localStorage.removeItem('bolke_token');
    updateUI();
    await new Promise(r => setTimeout(r, 600));
    return { reply: getDemoResponse(userMessage), action: null, data: {} };
  }

  const d = await res.json();
  if (d.error) throw new Error(d.error);

  const raw = d.choices?.[0]?.message?.content || '{}';
  let parsed;
  try { parsed = JSON.parse(raw.replace(/```json|```/g, '').trim()); }
  catch { parsed = { reply: raw, action: null }; }
  chatHistory.push({ role: 'assistant', content: raw });
  return parsed;
}

// ─── Action handler ───────────────────────────────────────────────────────────
async function handleAction(parsed) {
  // No mutations in demo mode
  if (!isAuthorized) return '';

  const { action, data } = parsed;
  if (action === 'add_worker' && data?.name) {
    const n = data.name.trim();
    if (!workers[n]) workers[n] = { monthlySalary: data.monthlySalary || 0, absences: [] };
    else workers[n].monthlySalary = data.monthlySalary || workers[n].monthlySalary;
    const saved = await saveWorkerSupa(n, workers[n].monthlySalary);
    if (saved) workers[n]._id = saved.id;
    persist(); renderRecords();
  }
  if (action === 'log_absence' && data?.name) {
    const n = data.name.trim();
    if (workers[n]) {
      const abs = workers[n].absences || [];
      if (!abs.find(a => a.date === data.date)) {
        abs.push({ date: data.date, type: data.type || 'absent' });
        workers[n].absences = abs;
        await saveAbsenceSupa(workers[n]._id, data.date, data.type || 'absent');
        persist(); renderRecords();
      }
    }
  }
  if (action === 'calculate_pay') {
    const names = data?.name === 'all' ? Object.keys(workers) : [data?.name];
    let extra = '\n\n';
    names.forEach(name => {
      const w = workers[name]; if (!w) return;
      const sal = w.monthlySalary || 0, rate = sal / 26;
      const full = (w.absences || []).filter(a => a.type === 'absent').length;
      const half = (w.absences || []).filter(a => a.type === 'half').length;
      const ded  = full * rate + half * (rate / 2);
      extra += `📋 ${name}\n  Salary: ₹${sal.toLocaleString('en-IN')}\n  Full absent: ${full}\n  Half days: ${half}\n  Deduction: ₹${Math.round(ded).toLocaleString('en-IN')}\n  ✅ Pay: ₹${Math.round(sal-ded).toLocaleString('en-IN')}\n\n`;
    });
    return extra;
  }
  return '';
}

// ─── Send message ─────────────────────────────────────────────────────────────
async function sendMessage(text) {
  const input = document.getElementById('userInput');
  const btn   = document.getElementById('sendBtn');
  const msg   = (typeof text === 'string' && text.trim()) ? text.trim() : input.value.trim();
  if (!msg) return;
  appendMsg('user', msg);
  input.value = ''; btn.disabled = true; showTyping();
  try {
    const parsed = await callAI(msg);
    hideTyping();
    const extra = await handleAction(parsed);
    appendMsg('bot', (parsed.reply || 'Done!') + (extra || ''));
  } catch(err) {
    hideTyping();
    appendMsg('bot', 'Sorry, something went wrong.\n' + err.message, false);
    console.error(err);
  }
  btn.disabled = false;
}
document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

// ─── Voice (Groq Whisper via Vercel function) ─────────────────────────────────
let mediaRecorder = null, audioChunks = [], isRecording = false;

function setMicState(state) {
  const btn = document.getElementById('micBtn');
  const sts = document.getElementById('micStatus');
  btn.className = ''; btn.disabled = false;
  if (state === 'idle')        { btn.textContent = '🎤'; sts.textContent = 'Tap mic to speak'; }
  else if (state === 'listening')  { btn.classList.add('listening'); btn.textContent = '⏹'; sts.textContent = '🔴 Recording — tap to stop'; }
  else if (state === 'processing') { btn.classList.add('processing'); btn.textContent = '⏳'; sts.textContent = 'Converting speech...'; btn.disabled = true; }
}

// Convert blob to base64 using arrayBuffer (more reliable than FileReader data URL)
async function blobToBase64(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const bytes = new Uint8Array(arrayBuffer);
  let binary = '';
  // Process in chunks to avoid call stack overflow on large audio
  const chunkSize = 8192;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

async function toggleMic() {
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    appendMsg('bot', '🚫 Mic requires HTTPS. Open your Vercel URL in Chrome.', false); return;
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    appendMsg('bot', '🚫 Mic not supported. Please use Chrome.', false); return;
  }
  if (isRecording) {
    isRecording = false;
    if (mediaRecorder?.state !== 'inactive') mediaRecorder.stop();
    return;
  }

  try {
    setMicState('listening');
    document.getElementById('micStatus').textContent = 'Requesting mic access...';
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    document.getElementById('micStatus').textContent = '🔴 Recording — tap ⏹ to stop';

    const types = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4',''];
    let mime = '';
    for (const t of types) { if (!t || MediaRecorder.isTypeSupported(t)) { mime = t; break; } }

    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    const actualMime = mediaRecorder.mimeType || mime;

    mediaRecorder.ondataavailable = e => { if (e.data?.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      setMicState('processing');
      if (!audioChunks.length) { appendMsg('bot', '⚠ No audio captured. Try again.', false); setMicState('idle'); return; }

      const blob = new Blob(audioChunks, { type: actualMime || 'audio/webm' });
      if (blob.size < 500) { document.getElementById('micStatus').textContent = 'Too short — speak and tap again'; setMicState('idle'); return; }

      let ext = 'webm';
      if (actualMime.includes('mp4')) ext = 'mp4';
      else if (actualMime.includes('ogg')) ext = 'ogg';

      try {
        document.getElementById('micStatus').textContent = 'Sending to Whisper...';

        const base64Audio = await blobToBase64(blob);
        const res = await fetch('/api/voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-demo-token': authToken },
          body: JSON.stringify({ audio: base64Audio, mimeType: actualMime, ext })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || 'Voice API error: ' + res.status);
        }
        const result = await res.json();
        if (result.error) throw new Error(result.error);

        const t = result.text?.trim();
        if (t) {
          document.getElementById('micStatus').textContent = `Heard: "${t.substring(0,42)}${t.length>42?'…':''}"`;
          setMicState('idle');
          await sendMessage(t);
        } else {
          document.getElementById('micStatus').textContent = 'Could not hear clearly. Try again.';
          setMicState('idle');
        }
      } catch(err) {
        appendMsg('bot', '⚠ Voice error: ' + err.message, false);
        setMicState('idle');
      }
    };

    mediaRecorder.start(100);
    isRecording = true;

  } catch(err) {
    isRecording = false; setMicState('idle');
    if (err.name === 'NotAllowedError') {
      appendMsg('bot', '🚫 Mic permission denied.\n\nFix: Tap 🔒 in Chrome → Site settings → Microphone → Allow → reload.', false);
    } else {
      appendMsg('bot', '🚫 Mic error: ' + err.name + ' — ' + err.message, false);
    }
  }
}
